name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PATH: app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Sign APK with v2+v3
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/zbrowser-signed.apk"

          # Locate apksigner
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          # Sign with v2 + v3 only (no v1 JAR signing)
          "$APKSIGNER" sign \
            --ks app/release.keystore \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v1-signing-enabled false \
            --out "$SIGNED_APK" \
            "$APK_PATH"

          echo "APK signed successfully with v2+v3"
          "$APKSIGNER" verify -v "$SIGNED_APK" || true

      - name: Compute SHA-256
        id: checksum
        run: |
          SIGNED_APK="app/build/outputs/apk/release/zbrowser-signed.apk"
          SHA256=$(sha256sum "$SIGNED_APK" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA256"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ZBrowser v1.0.${{ github.run_number }}
          body: |
            ZBrowser Release Build

            **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`

            **Signing:** v2 + v3 (Android 8.0+)
          files: |
            app/build/outputs/apk/release/zbrowser-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
