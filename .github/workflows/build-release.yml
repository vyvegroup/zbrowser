name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-sign:
    name: Build, Sign & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "${{ steps.find_apk.outputs.apk_path }}"

      - name: Generate SHA-256 checksum
        run: |
          sha256sum "${{ steps.find_apk.outputs.apk_path }}" > app-release.apk.sha256
          echo "SHA-256 checksum:"
          cat app-release.apk.sha256
          echo ""
          echo "APK file size:"
          ls -lh "${{ steps.find_apk.outputs.apk_path }}"

      - name: Upload Signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            app-release.apk.sha256
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: ZBrowser ${{ github.ref_name || 'v1.0.0' }}
          body: |
            ## ZBrowser Release ${{ github.ref_name || 'v1.0.0' }}

            ### Features
            - Chromium WebView-based browser
            - Material Design 3 UI with dark mode
            - Multi-tab browsing and Incognito mode
            - Bookmarks and History management
            - Find in page and Desktop mode
            - Download manager and Share

            ### Installation
            1. Download the APK file below
            2. Enable "Install from unknown sources" in your device settings
            3. Install the APK

            ### APK Signature
            - Signed with v1 (JAR) + v2 (APK Signature Scheme v2) + v3 (APK Signature Scheme v3)
            - SHA-256 checksum file included for verification

            **Minimum Android Version:** Android 8.0 (API 26)
          draft: false
          prerelease: false
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            app-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
